<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <article class="card">
   <img class="card__avatar" src="./assets/images/avatar-jessica.jpeg" alt="">
   <p class="card__name">Jessica Randall</p>
   <p class="card__place">London, United Kingdom</p>
   <p class="card__intro">"Front-end developer and avid reader."</p>

   <ul class="card__social-links">
    <li><a href="#" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    <li> <a href="#" target="_blank" rel="noopener noreferrer">Frontend Mentor</a></li>
    <li> <a href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
    <li> <a href="#" target="_blank" rel="noopener noreferrer">Twitter</a></li>
    <li> <a href="#" target="_blank" rel="noopener noreferrer">Instagram</a></li>
   </ul>
  </article>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
